<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darts">
<meta name="theme-color" content="#0a1a0a">
<title>Andys Darts Scorer</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080f08;
    --surface: #0f1f0f;
    --surface2: #162416;
    --border: #1e3a1e;
    --green: #22c55e;
    --green-dim: #166534;
    --green-bright: #4ade80;
    --red: #ef4444;
    --gold: #f59e0b;
    --text: #e2f5e2;
    --text-dim: #6b9b6b;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    height: 100vh;
    height: -webkit-fill-available;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, #0d2b0d 0%, transparent 70%),
      repeating-linear-gradient(0deg, transparent, transparent 39px, #0f1f0f33 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, #0f1f0f33 40px);
    pointer-events: none;
    z-index: 0;
  }

  .screen { position: relative; z-index: 1; }

  /* ── SETUP ── */
  #setup-screen {
    height: 100vh;
    height: -webkit-fill-available;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px 20px 30px;
    gap: 16px;
    overflow-y: auto;
  }

  .logo img {
    width: 150px; height: 150px; border-radius: 24px;
    box-shadow: 0 0 40px #22c55e33; display: block;
  }

  .setup-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; width: 100%;
    max-width: 480px; display: flex; flex-direction: column; gap: 16px;
  }

  .field-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }

  .game-type-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .gt-btn {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim);
    font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px;
    padding: 12px 8px; border-radius: 8px; cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .gt-btn.active { background: var(--green-dim); border-color: var(--green); color: var(--green-bright); }

  .custom-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; display: none; }
  .custom-row input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: 'Barlow', sans-serif; font-size: 16px; padding: 10px 14px; outline: none;
  }
  .custom-row input:focus { border-color: var(--green); }
  .custom-row input::placeholder { color: var(--text-dim); }
  .custom-row button {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim);
    font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 1px;
    padding: 10px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  }
  .custom-row button.active { background: var(--green-dim); border-color: var(--green); color: var(--green-bright); }

  .legs-row { display: flex; gap: 8px; }
  .legs-btn {
    flex: 1; background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim);
    font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px;
    padding: 10px 4px; border-radius: 8px; cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .legs-btn.active { background: var(--green-dim); border-color: var(--green); color: var(--green-bright); }

  .player-count-row { display: flex; align-items: center; gap: 12px; }
  .count-btn {
    width: 40px; height: 40px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .count-display { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--green-bright); min-width: 30px; text-align: center; }

  #player-names-container { display: flex; flex-direction: column; gap: 8px; }
  .player-name-row { display: flex; align-items: center; gap: 10px; }
  .player-num { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--green-dim); width: 24px; text-align: center; flex-shrink: 0; }
  .player-name-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: 'Barlow', sans-serif; font-size: 15px; padding: 10px 14px; outline: none;
  }
  .player-name-input:focus { border-color: var(--green); }
  .player-name-input::placeholder { color: #3a5a3a; }

  .start-btn {
    background: var(--green); border: none; border-radius: var(--radius); color: #050f05;
    font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px; padding: 16px;
    cursor: pointer; box-shadow: 0 4px 24px #22c55e44; width: 100%; max-width: 480px;
    transition: all 0.15s;
  }
  .start-btn:active { transform: scale(0.98); }

  /* ── BULL SCREEN ── */
  #bull-screen {
    display: none; height: 100vh; flex-direction: column;
    align-items: center; justify-content: center; padding: 40px 20px; gap: 24px; text-align: center;
  }
  .bull-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(36px,10vw,56px); letter-spacing: 4px; color: var(--green-bright); text-shadow: 0 0 30px #22c55e44; }
  .bull-sub { color: var(--text-dim); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
  .bull-players { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 400px; }
  .bull-player-btn {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-family: 'Barlow', sans-serif; font-size: 17px; font-weight: 600;
    padding: 18px 24px; cursor: pointer; transition: all 0.15s; text-align: left;
    display: flex; align-items: center; gap: 14px;
  }
  .bull-player-btn::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--green-dim); flex-shrink: 0; }
  .bull-player-btn:hover { border-color: var(--green); transform: translateX(4px); }

  /* ── GAME SCREEN ── */
  #game-screen {
    display: none;
    flex-direction: column;
    height: 100vh;
    height: -webkit-fill-available;
    overflow: hidden;
  }

  .game-header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 8px 14px; display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .game-header-title { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 3px; color: var(--green-bright); }
  .leg-indicator { font-family: 'Bebas Neue', sans-serif; font-size: 12px; letter-spacing: 2px; color: var(--text-dim); }
  .new-game-btn {
    background: transparent; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-dim); font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    padding: 5px 10px; cursor: pointer; transition: all 0.15s;
  }
  .new-game-btn:active { border-color: var(--red); color: var(--red); }

  .scoreboard {
    flex: 1;
    padding: 8px;
    display: grid;
    gap: 6px;
    overflow-y: auto;
    align-content: start;
    min-height: 0;
  }

  .player-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 12px;
    transition: border-color 0.2s; position: relative; overflow: hidden;
  }
  .player-card.active { border-color: var(--green); background: var(--surface2); box-shadow: 0 0 16px #22c55e18; }
  .player-card.active::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--green); }
  .player-card.busted { border-color: var(--red); animation: bust-flash 0.4s ease; }
  @keyframes bust-flash { 0%,100% { background: var(--surface); } 50% { background: #3a0a0a; } }
  .player-card.winner { border-color: var(--gold); background: #1a1200; animation: winner-pulse 1s ease infinite alternate; }
  @keyframes winner-pulse { from { box-shadow: 0 0 16px #f59e0b33; } to { box-shadow: 0 0 32px #f59e0b66; } }

  .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  .player-name-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); }
  .player-card.active .player-name-label { color: var(--green); }

  .card-top-right { display: flex; align-items: center; gap: 8px; }
  .active-badge {
    font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--green-bright);
    background: #22c55e1a; border: 1px solid var(--green-dim); border-radius: 4px;
    padding: 2px 6px; display: none;
  }
  .player-card.active .active-badge { display: block; }
  .avg-display { font-size: 11px; color: var(--text-dim); }
  .avg-display strong { color: var(--text); }

  .card-bottom { display: flex; align-items: flex-end; justify-content: space-between; }
  .player-score { font-family: 'Bebas Neue', sans-serif; font-size: clamp(38px, 9vw, 52px); line-height: 1; color: var(--text); }
  .player-card.active .player-score { color: var(--green-bright); }
  .player-card.winner .player-score { color: var(--gold); }

  .card-bottom-right { text-align: right; }
  .checkout-hint { font-size: 12px; color: var(--gold); font-weight: 600; min-height: 17px; }
  .legs-won-badge { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; }

  /* ── INPUT AREA ── */
  .input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 6px 8px 8px;
    flex-shrink: 0;
  }

  .current-player-banner { text-align: center; margin-bottom: 5px; line-height: 1; }
  .current-player-banner span { font-family: 'Bebas Neue', sans-serif; font-size: 11px; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase; }
  .current-player-banner strong { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: 2px; color: var(--green-bright); margin-left: 5px; }

  .score-display-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: stretch; }
  .score-display {
    flex: 1; background: var(--bg); border: 2px solid var(--green-dim); border-radius: var(--radius);
    color: var(--green-bright); font-family: 'Bebas Neue', sans-serif; font-size: 34px;
    letter-spacing: 2px; padding: 6px 10px; text-align: center;
    display: flex; align-items: center; justify-content: center; min-height: 52px;
  }
  .score-display.has-value { border-color: var(--green); }

  .bust-btn {
    background: transparent; border: 1px solid var(--red); border-radius: var(--radius);
    color: var(--red); font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 1px;
    padding: 0 12px; cursor: pointer; flex-shrink: 0; min-height: 52px;
  }
  .bust-btn:active { background: #3a0a0a; }

  .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .num-btn {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-family: 'Bebas Neue', sans-serif; font-size: 26px;
    padding: 13px 8px; cursor: pointer; text-align: center; line-height: 1;
    -webkit-user-select: none; user-select: none; transition: transform 0.08s;
  }
  .num-btn:active { background: var(--green-dim); border-color: var(--green); color: var(--green-bright); transform: scale(0.93); }
  .num-btn.enter-btn { background: var(--green); border-color: var(--green); color: #050f05; }
  .num-btn.enter-btn:active { background: var(--green-bright); }
  .num-btn.del-btn { color: var(--text-dim); font-size: 20px; }

  /* Quick score buttons */
  .quick-scores {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    margin-bottom: 6px;
  }
  .quick-btn {
    background: #1a3020; border: 1px solid var(--green-dim); border-radius: 8px;
    color: var(--green-bright); font-family: 'Bebas Neue', sans-serif; font-size: 20px;
    letter-spacing: 1px; padding: 10px 4px; cursor: pointer; text-align: center;
    -webkit-user-select: none; user-select: none; transition: transform 0.08s;
  }
  .quick-btn:active { background: var(--green-dim); border-color: var(--green); transform: scale(0.93); }

  /* ── WIN OVERLAY ── */
  #win-overlay {
    display: none; position: fixed; inset: 0; background: #000000dd; z-index: 100;
    align-items: center; justify-content: center; flex-direction: column;
    gap: 14px; text-align: center; padding: 30px 24px;
    backdrop-filter: blur(10px); overflow-y: auto;
  }
  .win-trophy { font-size: 60px; animation: trophy-bounce 0.6s ease; }
  @keyframes trophy-bounce { 0% { transform: scale(0) rotate(-20deg); } 60% { transform: scale(1.2) rotate(5deg); } 100% { transform: scale(1) rotate(0); } }
  .win-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(34px,10vw,60px); letter-spacing: 6px; color: var(--gold); text-shadow: 0 0 40px #f59e0b66; }
  .win-name { font-family: 'Bebas Neue', sans-serif; font-size: clamp(22px,7vw,40px); letter-spacing: 4px; color: var(--text); }
  .win-stats {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 20px; width: 100%; max-width: 360px;
  }
  .win-stats-title { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px; }
  .win-avg-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .win-avg-row:last-child { border-bottom: none; }
  .win-avg-name { font-weight: 600; font-size: 14px; }
  .win-avg-val { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--green-bright); letter-spacing: 1px; }
  .win-avg-val.gold { color: var(--gold); }
  .win-avg-sub { font-size: 10px; color: var(--text-dim); }
  .win-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .win-btn {
    background: var(--green); border: none; border-radius: var(--radius); color: #050f05;
    font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px;
    padding: 13px 22px; cursor: pointer;
  }
  .win-btn:active { background: var(--green-bright); }
  .win-btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .win-btn.secondary:active { border-color: var(--green); color: var(--text); }
  /* ── CHECKOUT DARTS OVERLAY ── */
  #checkout-overlay {
    display: none; position: fixed; inset: 0; background: #000000ee; z-index: 200;
    align-items: center; justify-content: center; backdrop-filter: blur(8px);
  }
  .checkout-prompt {
    background: var(--surface); border: 1px solid var(--green); border-radius: var(--radius);
    padding: 28px 24px; width: 90%; max-width: 340px; text-align: center;
    box-shadow: 0 0 40px #22c55e33;
  }
  .checkout-prompt-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 4px;
    color: var(--gold); margin-bottom: 4px;
  }
  .checkout-prompt-name {
    font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px;
    color: var(--green-bright); margin-bottom: 10px;
  }
  .checkout-prompt-sub {
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 20px;
  }
  .checkout-dart-btns { display: flex; gap: 10px; }
  .checkout-dart-btn {
    flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-family: 'Bebas Neue', sans-serif; font-size: 18px;
    letter-spacing: 1px; padding: 14px 4px; cursor: pointer; transition: all 0.12s;
  }
  .checkout-dart-btn:hover { border-color: var(--green); color: var(--green-bright); background: var(--green-dim); }
  .checkout-dart-btn:active { transform: scale(0.95); }
</style>
</head>

  34:"D17",33:"T1 D15",32:"D16",31:"T7 D5",30:"D15",
  29:"T9 D1",28:"D14",27:"T9 D0",26:"D13",25:"T5 D5",
  24:"D12",23:"T1 D10",22:"D11",21:"T7 D0",20:"D10",
  19:"T1 D8",18:"D9",17:"T1 D7",16:"D8",15:"T1 D6",
  14:"D7",13:"T1 D5",12:"D6",11:"T1 D4",10:"D5",
  9:"T1 D3",8:"D4",7:"T1 D2",6:"D3",5:"T1 D1",
  4:"D2",3:"T1 D1",2:"D1"
};

// ═══ STATE
let gameType = 201;
let legsToWin = 1;
let playerCount = 2;
let players = [];
let turnOrder = [];
let currentTurnIdx = 0;
let currentInput = "";
let isMatchWin = false;

// ═══ SETUP
function selectGameType(value, btn) {
  gameType = value;
  document.querySelectorAll('.gt-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('custom-row').style.display = 'none';
  document.getElementById('custom-gt-btn').textContent = '✎';
  document.getElementById('custom-gt-btn').classList.remove('active');
}
function selectCustom(btn) {
  document.querySelectorAll('.gt-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('custom-row').style.display = 'flex';
}
function confirmCustom() {
  const val = parseInt(document.getElementById('custom-score-input').value);
  if (val && val > 0) {
    gameType = val;
    document.getElementById('custom-gt-btn').textContent = val;
    document.getElementById('custom-confirm-btn').classList.add('active');
  }
}
function selectLegs(n, btn) {
  legsToWin = n;
  document.querySelectorAll('.legs-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
function changePlayerCount(delta) {
  playerCount = Math.min(8, Math.max(2, playerCount + delta));
  document.getElementById('player-count-display').textContent = playerCount;
  renderPlayerInputs();
}
function renderPlayerInputs() {
  const container = document.getElementById('player-names-container');
  const existing = Array.from(container.querySelectorAll('.player-name-input')).map(i => i.value);
  container.innerHTML = '';
  for (let i = 0; i < playerCount; i++) {
    const row = document.createElement('div');
    row.className = 'player-name-row';
    row.innerHTML = `<span class="player-num">${i+1}</span><input class="player-name-input" type="text" placeholder="Player ${i+1}" maxlength="16" value="${existing[i]||''}">`;
    container.appendChild(row);
  }
}

function startBullThrow() {
  const inputs = document.querySelectorAll('.player-name-input');
  players = Array.from(inputs).map((inp, i) => ({
    name: inp.value.trim() || `Player ${i+1}`,
    score: gameType,
    legsWon: 0,
    // leg stats
    legDarts: 0, legScored: 0,
    // overall stats
    totalDarts: 0, totalScored: 0
  }));

  document.getElementById('setup-screen').style.display = 'none';
  const bull = document.getElementById('bull-screen');
  bull.style.display = 'flex';
  const bullPlayers = document.getElementById('bull-players');
  bullPlayers.innerHTML = '';
  players.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'bull-player-btn';
    btn.textContent = p.name;
    btn.onclick = () => beginLeg(i, true);
    bullPlayers.appendChild(btn);
  });
}

function beginLeg(firstIdx, isFirst) {
  players.forEach(p => { p.score = gameType; p.legDarts = 0; p.legScored = 0; });

  if (isFirst) {
    turnOrder = [];
    turnOrder.push(firstIdx);
    for (let i = 0; i < players.length; i++) { if (i !== firstIdx) turnOrder.push(i); }
  } else {
    // rotate: next player in sequence starts
    const shifted = [...turnOrder];
    shifted.push(shifted.shift());
    turnOrder = shifted;
  }

  currentTurnIdx = 0;
  currentInput = '';

  document.getElementById('bull-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'flex';

  const maxLegs = legsToWin === 1 ? 1 : legsToWin * 2 - 1;
  document.getElementById('game-header-title').textContent =
    gameType + (legsToWin > 1 ? ` · Best of ${maxLegs}` : '');

  renderScoreboard();
  updateInputArea();
}

// ═══ SCOREBOARD
function currentLeg() {
  return players.reduce((s,p) => s + p.legsWon, 0) + 1;
}

function renderScoreboard() {
  const board = document.getElementById('scoreboard');
  const cols = players.length <= 2 ? 1 : 2;
  board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  board.innerHTML = '';
  players.forEach((p, i) => {
    const isActive = turnOrder[currentTurnIdx] === i;
    const card = document.createElement('div');
    card.className = 'player-card' + (isActive ? ' active' : '');
    card.id = `card-${i}`;

    const legAvg = p.legDarts > 0 ? ((p.legScored / p.legDarts) * 3).toFixed(1) : '-';
    const checkout = isActive && p.score >= 2 && p.score <= 170 ? CHECKOUTS[p.score] : null;
    const legsStr = legsToWin > 1 ? `${p.legsWon} LEG${p.legsWon !== 1 ? 'S' : ''}` : '';

    card.innerHTML = `
      <div class="card-top">
        <div class="player-name-label">${p.name}</div>
        <div class="card-top-right">
          <div class="avg-display">AVG <strong id="avg-${i}">${legAvg}</strong></div>
          <div class="active-badge">NOW</div>
        </div>
      </div>
      <div class="card-bottom">
        <div class="player-score" id="score-${i}">${p.score}</div>
        <div class="card-bottom-right">
          ${legsStr ? `<div class="legs-won-badge">${legsStr}</div>` : ''}
          <div class="checkout-hint" id="co-${i}">${checkout ? '🎯 '+checkout : ''}</div>
        </div>
      </div>`;
    board.appendChild(card);
  });
  document.getElementById('leg-indicator').textContent = `LEG ${currentLeg()}`;
}

function updateScoreDisplay() {
  players.forEach((p, i) => {
    const isActive = turnOrder[currentTurnIdx] === i;
    const el = id => document.getElementById(id);
    if (el(`score-${i}`)) el(`score-${i}`).textContent = p.score;
    if (el(`avg-${i}`)) {
      el(`avg-${i}`).textContent = p.legDarts > 0 ? ((p.legScored / p.legDarts) * 3).toFixed(1) : '-';
    }
    if (el(`co-${i}`)) {
      const co = isActive && p.score >= 2 && p.score <= 170 ? CHECKOUTS[p.score] : null;
      el(`co-${i}`).textContent = co ? '🎯 '+co : '';
    }
    const card = el(`card-${i}`);
    if (card) card.className = 'player-card' + (isActive ? ' active' : '');
  });
  document.getElementById('leg-indicator').textContent = `LEG ${currentLeg()}`;
}

// ═══ NUMPAD
function quickScore(val) {
  currentInput = String(val);
  refreshDisplay();
  submitScore();
}

function numPress(d) {
  if (currentInput.length >= 3) return;
  currentInput += d;
  refreshDisplay();
}
function numDel() {
  currentInput = currentInput.slice(0,-1);
  refreshDisplay();
}
function refreshDisplay() {
  const el = document.getElementById('score-display');
  el.textContent = currentInput === '' ? '—' : currentInput;
  el.classList.toggle('has-value', currentInput !== '');
}
function updateInputArea() {
  const idx = turnOrder[currentTurnIdx];
  document.getElementById('current-player-name').textContent = players[idx].name;
  currentInput = '';
  refreshDisplay();
}

// ═══ SCORING
let pendingCheckoutIdx = -1;
let pendingCheckoutScored = 0;

function submitScore() {
  if (currentInput === '') return;
  const scored = parseInt(currentInput);
  if (isNaN(scored) || scored < 0 || scored > 180) { currentInput = ''; refreshDisplay(); return; }

  const idx = turnOrder[currentTurnIdx];
  const p = players[idx];
  const newScore = p.score - scored;

  if (newScore < 0 || newScore === 1) { triggerBust(idx, false); return; }

  if (newScore === 0) {
    // Ask how many darts for the checkout
    pendingCheckoutIdx = idx;
    pendingCheckoutScored = scored;
    currentInput = '';
    refreshDisplay();
    document.getElementById('checkout-prompt-name').textContent = p.name;
    document.getElementById('checkout-overlay').style.display = 'flex';
    return;
  }

  p.score = newScore;
  p.legDarts += 3; p.legScored += scored;
  p.totalDarts += 3; p.totalScored += scored;
  advanceTurn();
}

function confirmCheckout(darts) {
  document.getElementById('checkout-overlay').style.display = 'none';
  const idx = pendingCheckoutIdx;
  const p = players[idx];
  p.score = 0;
  // Count all darts in this visit: previous throws this visit were 3 minus remaining
  // We don't track per-visit, so just record how many darts they actually used
  p.legDarts += darts; p.legScored += pendingCheckoutScored;
  p.totalDarts += darts; p.totalScored += pendingCheckoutScored;
  p.legsWon++;
  updateScoreDisplay();
  checkWin(idx);
}

function recordBust() {
  const idx = turnOrder[currentTurnIdx];
  players[idx].legDarts += 3;
  players[idx].totalDarts += 3;
  triggerBust(idx, true);
}

function triggerBust(idx, fromButton) {
  currentInput = '';
  const card = document.getElementById(`card-${idx}`);
  if (card) { card.classList.add('busted'); setTimeout(() => card.classList.remove('busted'), 450); }
  setTimeout(() => advanceTurn(), fromButton ? 0 : 0);
}

function advanceTurn() {
  currentTurnIdx = (currentTurnIdx + 1) % turnOrder.length;
  updateScoreDisplay();
  updateInputArea();
}

// ═══ WIN
function checkWin(winnerIdx) {
  const winner = players[winnerIdx];
  isMatchWin = winner.legsWon >= legsToWin;
  showWin(winnerIdx, isMatchWin);
}

function showWin(winnerIdx, matchWin) {
  const winner = players[winnerIdx];
  document.getElementById('win-title').textContent = matchWin ? 'MATCH WIN!' : 'LEG WIN!';
  document.getElementById('win-player-name').textContent = winner.name;

  // Stats
  const statsDiv = document.getElementById('win-stats');
  const title = matchWin ? 'Overall Averages' : 'Leg Averages';
  let rows = '';

  // Sort by leg avg desc
  const sorted = [...players].sort((a,b) => {
    const aA = a.legDarts > 0 ? (a.legScored/a.legDarts)*3 : 0;
    const bA = b.legDarts > 0 ? (b.legScored/b.legDarts)*3 : 0;
    return bA - aA;
  });

  sorted.forEach(p => {
    const legAvg = p.legDarts > 0 ? ((p.legScored/p.legDarts)*3).toFixed(2) : '0.00';
    const totalAvg = p.totalDarts > 0 ? ((p.totalScored/p.totalDarts)*3).toFixed(2) : '0.00';
    const isW = p === winner;
    const showOverall = matchWin && legsToWin > 1;
    rows += `<div class="win-avg-row">
      <span class="win-avg-name">${p.name}${isW ? ' 🏆' : ''}</span>
      <div style="text-align:right">
        <div class="win-avg-val${isW?' gold':''}">${showOverall ? totalAvg : legAvg}</div>
        ${!matchWin && p.totalDarts > p.legDarts ? `<div class="win-avg-sub">Overall: ${totalAvg}</div>` : ''}
        ${legsToWin > 1 ? `<div class="win-avg-sub">${p.legsWon} leg${p.legsWon!==1?'s':''} won</div>` : ''}
      </div>
    </div>`;
  });

  statsDiv.innerHTML = `<div class="win-stats-title">${title}</div>${rows}`;

  const nextBtn = document.getElementById('win-next-btn');
  if (matchWin) {
    nextBtn.textContent = 'SAME GAME';
    nextBtn.onclick = sameGame;
  } else {
    nextBtn.textContent = 'NEXT LEG';
    nextBtn.onclick = nextLeg;
  }

  document.getElementById('win-overlay').style.display = 'flex';
}

function nextLeg() {
  document.getElementById('win-overlay').style.display = 'none';
  beginLeg(0, false);
}
function sameGame() {
  document.getElementById('win-overlay').style.display = 'none';
  players.forEach(p => { p.legsWon = 0; p.totalDarts = 0; p.totalScored = 0; });
  beginLeg(turnOrder[0], true);
}
function goToSetup() {
  document.getElementById('win-overlay').style.display = 'none';
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'flex';
}
function confirmNewGame() { if (confirm('Start a new game?')) goToSetup(); }

// ═══ INIT
renderPlayerInputs();

// Keyboard support for desktop
document.addEventListener('keydown', e => {
  const gameScreen = document.getElementById('game-screen');
  const checkoutOverlay = document.getElementById('checkout-overlay');
  if (gameScreen.style.display !== 'flex') return;
  if (checkoutOverlay.style.display === 'flex') {
    if (e.key === '1') confirmCheckout(1);
    if (e.key === '2') confirmCheckout(2);
    if (e.key === '3') confirmCheckout(3);
    return;
  }
  if (e.key >= '0' && e.key <= '9') { e.preventDefault(); numPress(parseInt(e.key)); }
  if (e.key === 'Backspace') { e.preventDefault(); numDel(); }
  if (e.key === 'Enter') { e.preventDefault(); submitScore(); }
});
</script>
